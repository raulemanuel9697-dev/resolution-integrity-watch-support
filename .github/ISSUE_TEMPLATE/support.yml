name: Product support
description: Ask a non-sensitive question about Resolution Integrity Watch.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: >-
        This issue is public. Never include Jira issue keys, site URLs, customer or personal data,
        credentials, API tokens, confidential issue text, or screenshots containing such information.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version shown in the app or Marketplace.
      placeholder: 2.x.x
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Development
        - Staging
        - Production
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: flow
    attributes:
      label: Where did it happen?
      options:
        - Run now
        - Daily scheduled scan
        - Installation or licensing
        - Other
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Safe error code, if shown
      description: Do not paste stack traces or issue contents.
      placeholder: access_denied
  - type: input
    id: approximate-time
    attributes:
      label: Approximate time (UTC)
      placeholder: YYYY-MM-DD HH:MM UTC
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior without customer data, issue keys, site URLs, or confidential content.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-content check
      options:
        - label: I checked this public issue and have not included Jira issue keys, site URLs, personal data, customer data, credentials, or confidential content.
          required: true
